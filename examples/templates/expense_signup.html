{% extends "expense_base.html" %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto 0 auto;" class="card">
    <h2>Sign Up for Expense Tracker</h2>
    
    {% if error %}
        <p class="status-negative" style="background: rgba(239, 68, 68, 0.1); padding: 0.75rem; border-radius: 8px;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST" action="/signup">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign Up</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: #94a3b8;">
        Already have an account? <a href="/login" style="color: #818cf8; text-decoration: none; font-weight: 600;">Login</a>
    </p>
</div>
{% endblock %}
