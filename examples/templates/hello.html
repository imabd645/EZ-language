<!DOCTYPE html>
<html>
<head>
    <title>Hello {{ name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .box { padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .alert { background: #ffcccc; padding: 10px; border-left: 5px solid red; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello, {{ name }}!</h1>
        
        {% if show_alert %}
            <div class="alert">
                <strong>Alert:</strong> Dynamic templating is fully operational natively!
            </div>
        {% else %}
            <p>Everything is running smoothly.</p>
        {% endif %}
        
        <h3>Your Shopping List:</h3>
        <ul>
        {% for item in items %}
            <li>{{ item }}</li>
        {% endfor %}
        </ul>
        
        <p><a href="/">Go Back Home</a></p>
    </div>
</body>
</html>
