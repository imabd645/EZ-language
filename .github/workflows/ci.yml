name: Build and Test EZ Language

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    # A hung test used to be able to burn the whole 6-hour default. The suite
    # takes a couple of minutes; anything beyond this is stuck, not slow.
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        # `update: true` re-syncs the whole package database on every run and is
        # a common source of flaky, slow CI. The pinned toolchain below is
        # enough to build.
        update: false
        # Caches the installed packages between runs.
        cache: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-libffi
          mingw-w64-x86_64-libuv
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-zlib

    - name: Configure and build
      shell: msys2 {0}
      run: |
        set -e
        mkdir -p build
        cd build
        cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . -j4

    # ez.exe links libstdc++ and libwinpthread dynamically, so it only starts
    # when MinGW's bin directory is reachable. The test runner below is
    # PowerShell, which does not inherit the msys2 shell's PATH -- without this
    # every test dies with 0xC0000135 (STATUS_DLL_NOT_FOUND) and the job reports
    # "N tests failed" while saying nothing about the real cause.
    #
    # Copying the two DLLs next to the binary makes it self-contained, which
    # also matters for the artifact uploaded at the end.
    - name: Bundle runtime DLLs
      shell: msys2 {0}
      run: |
        set -e
        # Resolved from the binary rather than hardcoded, and followed
        # transitively: ez.exe imports only libstdc++-6 and libwinpthread-1, but
        # libstdc++ itself pulls in libgcc_s_seh-1, and missing that one fails
        # exactly like missing the others.
        copy_deps() {
          objdump -p "$1" 2>/dev/null \
            | grep "DLL Name:" | sed 's/.*DLL Name: *//' \
            | while read -r dll; do
                if [ -f "/mingw64/bin/$dll" ] && [ ! -f "build/$dll" ]; then
                  cp "/mingw64/bin/$dll" build/
                  copy_deps "build/$dll"
                fi
              done
        }
        copy_deps build/ez.exe
        ls -l build/ez.exe build/*.dll

    # Put MinGW's bin on PATH for every later step.
    #
    # The bundling step above walks ez.exe's IMPORT table, which by definition
    # cannot see libraries the language opens at runtime through os_load_lib --
    # sqlite3, curl and friends. lib/db.ez asks for "sqlite3.dll" first, so
    # without this the runner resolved whatever happened to be on its PATH,
    # os_get_func returned 0 for every sqlite symbol, and the first os_call
    # faulted with "Access violation inside external DLL" -- taking out
    # test_db_advanced, test_ffi_db and test_sqlite_ffi together.
    - name: Add MinGW to PATH
      shell: msys2 {0}
      run: cygpath -w /mingw64/bin >> "$GITHUB_PATH"

    - name: Smoke test
      shell: pwsh
      run: |
        "out ""hello from CI""" | Set-Content smoke.ez
        .\build\ez.exe smoke.ez
        if ($LASTEXITCODE -ne 0) { throw "interpreter failed to run" }

    # Prove the FFI can actually reach sqlite before running the suite, so a
    # missing DLL is reported here rather than as three unrelated test failures.
    - name: Check sqlite FFI is reachable
      shell: pwsh
      run: |
        @'
        use "lib/db.ez" as *
        d = Database(":memory:")
        d.execute("CREATE TABLE t (id INTEGER PRIMARY KEY)", nil)
        d.close()
        out "sqlite FFI OK"
        '@ | Set-Content sqlite_check.ez
        .\build\ez.exe sqlite_check.ez
        if ($LASTEXITCODE -ne 0) { throw "sqlite FFI is not usable on this runner" }

    # Uses the repository's own runner rather than a shell loop over *.ez.
    # It already handles the things a glob cannot: a per-test timeout, the
    # exclusion list for tests that open a window or bind a socket, tests that
    # are expected to fail compilation, and tests that print FAIL while still
    # exiting 0.
    # On failure the runner prints each failing test's full output -- the
    # exception text and traceback -- as a collapsible group, plus a GitHub
    # annotation pinned to the file. Previously it reported only a one-line
    # reason ("failure marker: !!! TEST FAILED") and deleted the captured
    # output, so a red CI run told you which test failed but never why, and the
    # only way to find out was to reproduce it locally.
    - name: Run test suite
      shell: pwsh
      run: .\scripts\run_tests.ps1 -IncludeHandwritten -TimeoutSec 60

    - name: Upload interpreter
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ez-windows-x64
        path: |
          build/ez.exe
          build/*.dll
        retention-days: 14
